name: Build MAXLoader

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: |
          brew install ldid || true

      - name: Build
        run: |
          xcodebuild -workspace AltStore.xcworkspace \
            -scheme AltStore \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AltStore.app Payload/
          zip -r MaxLoader.ipa Payload
          ls -la MaxLoader.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxLoader-ipa
          path: MaxLoader.ipa
          retention-days: 30
